<!DOCTYPE html>
<html>
<head>
    <title>Fake Internship & Job Detector</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: white;
            overflow: hidden;
        }

        .container {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(15px);
            padding: 40px;
            width: 650px;
            border-radius: 25px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.5);
            text-align: center;
            position: relative;
            animation: fadeIn 1s ease-in-out;
        }

        h1 {
            font-weight: 800;
            margin-bottom: 20px;
        }

        textarea {
            width: 100%;
            height: 140px;
            padding: 15px;
            border-radius: 15px;
            border: none;
            font-size: 14px;
            resize: none;
            outline: none;
        }

        button {
            margin-top: 20px;
            padding: 12px 30px;
            border-radius: 30px;
            border: none;
            background: linear-gradient(90deg, #00c6ff, #0072ff);
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            transform: scale(1.08);
        }

        .result-box {
            margin-top: 25px;
            padding: 20px;
            border-radius: 15px;
            font-weight: 600;
            font-size: 18px;
            animation: fadeIn 0.6s ease-in-out;
        }

        .real-box {
            background: rgba(0,255,120,0.15);
            color: #00ff88;
        }

        .fake-box {
            background: rgba(255,0,0,0.15);
            color: #ff4b4b;
        }

        .risk {
            margin-top: 10px;
            font-size: 14px;
        }

        /* STICKER STYLE */
        .sticker {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 200px;
            opacity: 0.9;
            animation: float 2s infinite ease-in-out;
        }

        .left {
            left: -220px;
        }

        .right {
            right: -220px;
        }

        @keyframes fadeIn {
            from {opacity: 0; transform: translateY(20px);}
            to {opacity: 1; transform: translateY(0);}
        }

        @keyframes float {
            0% { transform: translateY(-50%) scale(1); }
            50% { transform: translateY(-50%) scale(1.05); }
            100% { transform: translateY(-50%) scale(1); }
        }

    </style>
</head>
<body>

<div class="container">

    <h1>🛡 Fake Internship & Job Detector</h1>

    <form method="POST">
        <textarea name="job_text" placeholder="Paste job description here..."></textarea>
        <button type="submit">Analyze</button>
    </form>

    {% if prediction %}
        <div class="result-box {% if 'Fake' in prediction %}fake-box{% else %}real-box{% endif %}">
            {{ prediction }}
            <div class="risk">Risk Score: {{ risk }}%</div>
        </div>

        {% if 'Fake' in prediction %}
            <img src="{{ url_for('static', filename='fake.png') }}" class="sticker left">
            <img src="{{ url_for('static', filename='fake.png') }}" class="sticker right">
        {% else %}
            <img src="{{ url_for('static', filename='real.png') }}" class="sticker left">
            <img src="{{ url_for('static', filename='real.png') }}" class="sticker right">
        {% endif %}
    {% endif %}

</div>

</body>
</html>
